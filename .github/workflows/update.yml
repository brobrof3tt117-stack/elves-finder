name: Update eBay listings

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install helper library
        run: pip install requests==2.32.3

      - name: Check eBay for sealed listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SHIP_TO_ZIP: ${{ vars.SHIP_TO_ZIP }}
        run: python updater/update.py

      - name: Keep the hourly schedule switched on (one tiny save per day)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/last-run-day.txt updater/set-images.json
          git commit -m "Daily keep-alive and set pictures" || echo "Already saved today"
          git push || echo "Skipped keep-alive push this time"

      - name: Prepare website
        uses: actions/configure-pages@v5

      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
